<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Donat Hyper</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#060a13;
color:white;
font-family:Arial,sans-serif;
}

header{
padding:20px;
background:#0b1121;
font-size:24px;
font-weight:bold;
}

header span{
color:#388bff;
}

.grid{
padding:20px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
text-decoration:none;
color:white;
background:#0f1729;
border-radius:12px;
overflow:hidden;
display:block;
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.title{
padding:12px;
font-weight:bold;
font-size:16px;
}


@media(min-width:800px){
.grid{
grid-template-columns:repeat(5,1fr);
}
}
.pagination{
display:flex;
justify-content:center;
align-items:center;
gap:8px;
flex-wrap:wrap;
padding:30px 10px;
}


.pagination a{

background:#0f1729;
color:white;

padding:10px 16px;

border-radius:12px;

text-decoration:none;

font-weight:bold;

font-size:14px;

border:1px solid #263653;

transition:0.2s;

}


.pagination a:hover{

background:#388bff;

border-color:#388bff;

transform:translateY(-2px);

}

</style>

</head>


<body>

<header>
▶ Donat <span>Hyper</span>
</header>


<div class="grid" id="videos">
Loading...
</div>
<div class="pagination">

<a href="?page=1">Part 1</a>
<a href="?page=1">Part 1</a>
<a href="?page=2">Part 2</a>
<a href="?page=3">Part 3</a>
<a href="?page=4">Part 4</a>
<a href="?page=5">Part 5</a>
<a href="?page=6">Part 6</a>
<a href="?page=7">Part 7</a>
<a href="?page=8">Part 8</a>
<a href="?page=9">Part 9</a>
<a href="?page=10">Part 10</a>
<a href="?page=11">Part 11</a>
<a href="?page=12">Part 12</a>
<a href="?page=13">Part 13</a>
<a href="?page=14">Part 14</a>
<a href="?page=15">Part 15</a>
<a href="?page=16">Part 16</a>
<a href="?page=17">Part 17</a>
<a href="?page=18">Part 18</a>
<a href="?page=19">Part 19</a>
<a href="?page=20">Part 20</a>

</div>


<script>

async function loadVideos(){

const box=document.getElementById("videos");

try{

const page =
new URLSearchParams(window.location.search).get("page") || 1;


const res =
await fetch("/api/v1/video/list?page=" + page);


const data = await res.json();

console.log(data);


// API mengirim hasil dalam bentuk string "hasil"
const real = data;



if(!real.result || !real.result.videos){

box.innerHTML="Video kosong";
console.log(real);
return;

}



box.innerHTML="";



real.result.videos
.filter(video => video.status === "active")
.forEach(video=>{


box.innerHTML += `

<a class="card" href="/e/${video.filecode}">

<img src="${video.thumbnail || video.player_img || 'https://picsum.photos/400/600'}">

<div class="title">

${video.title || video.video_title || "Tanpa judul"}

</div>

</a>

`;


});


}catch(error){

console.log(error);

box.innerHTML="Gagal mengambil video";

}

}


loadVideos();


</script>


</body>
</html>
