<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Donat Hyper</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#060a13;
color:white;
font-family:Arial,sans-serif;
}

header{
padding:20px;
background:#0b1121;
font-size:24px;
font-weight:bold;
}

header span{
color:#388bff;
}

.grid{
padding:20px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
text-decoration:none;
color:white;
background:#0f1729;
border-radius:12px;
overflow:hidden;
display:block;
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.title{
padding:12px;
font-weight:bold;
font-size:16px;
}


@media(min-width:800px){
.grid{
grid-template-columns:repeat(5,1fr);
}
}

</style>

</head>


<body>

<header>
▶ Donat <span>Hyper</span>
</header>


<div class="grid" id="videos">
Loading...
</div>



<script>

async function loadVideos(){

const box=document.getElementById("videos");


try{


const res = await fetch("/api/v1/video/list");

const data = await res.json();

console.log(data);



if(!data.result || !data.result.videos){

box.innerHTML="Video kosong";
return;

}



box.innerHTML="";



data.result.videos.forEach(video=>{


box.innerHTML += `

<a class="card" href="/e/${video.filecode}">

<img src="${video.thumbnail || video.player_img || 'https://picsum.photos/400/600'}">

<div class="title">

${video.title || video.video_title || "Tanpa judul"}

</div>


</a>

`;


});



}catch(error){

console.log(error);

box.innerHTML="Gagal mengambil video";

}


}


loadVideos();


</script>


</body>
</html>
