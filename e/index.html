<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memuat Video - Donat Hyper</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;
  --surface:#0b1121;
  --text:#f5f7fb;
  --muted:#9ca6b8;
  --accent:#388bff;
  --border:rgba(255,255,255,.08);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:"Plus Jakarta Sans",Arial,sans-serif;
  min-height:100vh;
}

header{
  height:68px;
  display:flex;
  align-items:center;
  padding:0 20px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}

.back{
  color:#fff;
  text-decoration:none;
  font-size:15px;
  font-weight:700;
}

.container{
  width:100%;
  max-width:950px;
  margin:auto;
  padding:25px 16px 60px;
}

.status{
  text-align:center;
  color:var(--muted);
  padding:60px 15px;
}

.hidden{
  display:none!important;
}

/* VIDEO */
.video-box{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#050505;
  border-radius:14px;
  overflow:hidden;
}

.thumbnail{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.play-overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.18);
}

.play-button{
  width:78px;
  height:78px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-left:5px;
  background:rgba(0,0,0,.75);
  color:#fff;
  text-decoration:none;
  font-size:34px;
  transition:.2s;
}

.play-button:hover{
  transform:scale(1.07);
}

/* TITLE */
.title{
  margin-top:20px;
  font-size:24px;
  line-height:1.4;
  font-weight:800;
  word-break:break-word;
}

/* REPORT */
.report{
  display:inline-block;
  margin-top:16px;
  padding:10px 20px;
  border-radius:9px;
  border:1px solid rgba(255,255,255,.12);
  background:#151a23;
  color:#fff;
  text-decoration:none;
  font-size:14px;
  font-weight:700;
}

/* DOWNLOAD */
.download-box{
  margin-top:35px;
  padding:40px 20px;
  background:#eef4fb;
  border-radius:16px;
  text-align:center;
}

.download-title{
  color:#505b6c;
  font-size:21px;
  font-weight:600;
  margin-bottom:22px;
}

.download-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  min-width:270px;
  padding:17px 28px;
  border-radius:50px;
  background:#287cf0;
  color:#fff;
  text-decoration:none;
  font-size:17px;
  font-weight:800;
}

.download-icon{
  font-size:22px;
}

@media(max-width:600px){

  header{
    height:60px;
    padding:0 15px;
  }

  .container{
    padding:18px 12px 45px;
  }

  .video-box{
    border-radius:11px;
  }

  .play-button{
    width:64px;
    height:64px;
    font-size:28px;
  }

  .title{
    font-size:20px;
  }

  .download-box{
    margin-top:30px;
    padding:32px 15px;
  }

  .download-title{
    font-size:19px;
  }

  .download-button{
    width:100%;
    min-width:0;
    font-size:16px;
  }
}
</style>
</head>

<body>

<header>
  <a href="/" class="back">← Kembali ke Beranda</a>
</header>

<main class="container">

  <div id="loading" class="status">
    Memuat video...
  </div>

  <div id="error" class="status hidden">
    Gagal memuat video.
  </div>

  <div id="content" class="hidden">

    <div class="video-box">

      <img
        id="thumbnail"
        class="thumbnail"
        src=""
        alt="Thumbnail video"
      >

      <div class="play-overlay">

        <a
          id="playButton"
          class="play-button"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >
          ▶
        </a>

      </div>

    </div>

    <h1 id="videoTitle" class="title">
      Memuat judul...
    </h1>

    <a
      href="javascript:void(0)"
      class="report"
      onclick="return false;"
    >
      Report
    </a>

    <div class="download-box">

      <div class="download-title">
        Your file is ready
      </div>

      <a
        id="downloadButton"
        class="download-button"
        href="https://auctionr.org/4/b2e04fb72c8768c1d81819ff3cfd7294"
        rel="noopener noreferrer"
      >
        <span class="download-icon">⇩</span>
        Download file
      </a>

    </div>

  </div>

</main>

<script>

const parts = window.location.pathname
  .split("/")
  .filter(Boolean);

const eIndex = parts.indexOf("e");

const filecode =
  eIndex >= 0 && parts[eIndex + 1]
    ? decodeURIComponent(parts[eIndex + 1])
    : "";

async function loadVideo(){

  const loading =
    document.getElementById("loading");

  const content =
    document.getElementById("content");

  const error =
    document.getElementById("error");

  const title =
    document.getElementById("videoTitle");

  const thumbnail =
    document.getElementById("thumbnail");

  const playButton =
    document.getElementById("playButton");

  if(!filecode){

    loading.classList.add("hidden");

    error.textContent =
      "Video tidak ditemukan.";

    error.classList.remove("hidden");

    return;
  }

  try{

    /*
      API KEY TIDAK ADA DI SINI.
      Cloudflare Function yang menangani API key.
    */

    const apiUrl =
      "/api/v1/video/info?filecode=" +
      encodeURIComponent(filecode);

    const response =
      await fetch(apiUrl);

    if(!response.ok){
      throw new Error(
        "API error " + response.status
      );
    }

    const data =
      await response.json();

    const video =
      Array.isArray(data.result)
        ? data.result[0]
        : data.result;

    if(!video){
      throw new Error(
        "Data video tidak ditemukan"
      );
    }

    const videoTitle =
      video.video_title ||
      video.title ||
      "Video";

    title.textContent =
      videoTitle;

    document.title =
      videoTitle + " - Donat Hyper";

    if(video.player_img){
      thumbnail.src =
        video.player_img;
    }

    if(video.link){

      playButton.href =
        video.link;

    }else{

      throw new Error(
        "Link video tidak tersedia"
      );

    }

    loading.classList.add("hidden");

    content.classList.remove("hidden");

  }catch(err){

    console.error(
      "Video error:",
      err
    );

    loading.classList.add("hidden");

    error.textContent =
      "Gagal memuat video.";

    error.classList.remove("hidden");

  }
}

loadVideo();

</script>

</body>
</html>
