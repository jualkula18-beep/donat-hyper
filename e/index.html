<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memutar Video - Donat Hyper</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:#000;
      --text:#f0f2f5;
      --text-secondary:#8c94a3;
      --accent:#388bff;
      --border:rgba(255,255,255,.08);
      --font:'Plus Jakarta Sans',sans-serif;
    }

    *,*::before,*::after {
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body {
      font-family:var(--font);
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }

    .top-bar {
      width:100%;
      padding:16px 24px;
      border-bottom:1px solid var(--border);
    }

    .back-btn {
      color:var(--text-secondary);
      text-decoration:none;
      font-size:14px;
      font-weight:600;
    }

    .player-container {
      width:100%;
      max-width:900px;
      margin:auto;
      padding:24px 20px 60px;
    }

    .video-wrapper {
      width:100%;
      min-height:300px;
      background:#0a0a0a;
      border-radius:12px;
      margin-bottom:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:30px;
      text-align:center;
    }

    .video-title {
      font-size:20px;
      font-weight:800;
    }

    .loading {
      color:var(--text-secondary);
      margin-top:12px;
      word-break:break-word;
    }

    @media(max-width:640px) {
      .video-title {
        font-size:16px;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <a href="/" class="back-btn">← Kembali ke Beranda</a>
  </div>

  <main class="player-container">

    <div class="video-wrapper">
      <div id="status">
        Memuat video...
      </div>
    </div>

    <h1 class="video-title" id="videoTitle">
      Memuat judul...
    </h1>

  </main>

  <script>
    const API_KEY =
      '7d33e4000112589c0d5a8fc76b454c97c23886e9eacc92e01ec994bd5b88117c';

    const pathParts = window.location.pathname
      .split("/")
      .filter(Boolean);

    const eIndex = pathParts.indexOf("e");

    const filecode =
      eIndex >= 0 && pathParts[eIndex + 1]
        ? decodeURIComponent(pathParts[eIndex + 1])
        : "";

    async function load() {

      const titleElement =
        document.getElementById("videoTitle");

      const status =
        document.getElementById("status");

      if (!filecode) {
        titleElement.textContent = "Video tidak ditemukan";
        status.textContent = "";
        return;
      }

      try {

        status.textContent = "Memuat data video...";

        const apiUrl =
          `/_api/v1/video/info?api_key=${encodeURIComponent(API_KEY)}&filecode=${encodeURIComponent(filecode)}`;

        const res = await fetch(apiUrl);

        if (!res.ok) {
          throw new Error("API error: " + res.status);
        }

        const data = await res.json();

        console.log("API response:", data);

        const video =
          Array.isArray(data.result)
            ? data.result[0]
            : data.result;

        if (!video) {
          throw new Error("Data video tidak ditemukan");
        }

        const videoLink = video.link || "";

        const title =
          video.video_title || "Video";

        titleElement.textContent = title;
        document.title =
          title + " - Donat Hyper";

        if (videoLink) {
          status.innerHTML =
            "Link video ditemukan:<br><br>" +
            "<strong>" +
            videoLink +
            "</strong>";
        } else {
          status.textContent =
            "Link video tidak tersedia.";
        }

      } catch (error) {

        console.error("Gagal memuat video:", error);

        titleElement.textContent =
          "Gagal memuat video";

        status.textContent =
          error.message;
      }
    }

    load();
  </script>

</body>
</html>
