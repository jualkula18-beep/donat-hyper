<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memutar Video - Donat Hyper</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000000; --surface: #0b1121; --text: #f0f2f5; --text-secondary: #8c94a3;
      --accent: #388bff; --border: rgba(255,255,255,0.08); --font: 'Plus Jakarta Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .top-bar { width: 100%; padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.2s; }
    .back-btn:hover { color: #fff; }
    .player-container { width: 100%; max-width: 900px; padding: 24px 20px 60px; }
    .video-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; background: #0a0a0a; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); margin-bottom: 24px; }
    .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .video-info { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 32px; gap: 16px; }
    .video-title { font-size: 20px; font-weight: 800; line-height: 1.3; }
    .btn-report { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-report:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1f2937; color: #fff; padding: 12px 24px; border-radius: 10px; opacity: 0; transition: 0.3s; z-index: 999; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    @media (max-width: 640px) { .video-title { font-size: 16px; } .video-info { flex-direction: column; } }
  </style>
</head>


<body>
  <div class="top-bar"><a href="/" class="back-btn"><svg viewBox="0 0 24 24" width="18" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg> Kembali ke Beranda</a></div>
  <main class="player-container">
    <div class="video-wrapper"><iframe id="videoPlayer" src="" allowfullscreen></iframe></div>
    <div class="video-info"><h1 class="video-title" id="videoTitle">Memuat judul...</h1><button class="btn-report" onclick="showToast()">Report</button></div>
  </main>
  <div class="toast" id="toast">Laporan diterima</div>
  <script>
        const pathParts = window.location.pathname.split('/').filter(Boolean);
    const eIndex = pathParts.indexOf('e');
    const filecode = eIndex >= 0 && pathParts[eIndex + 1]
      ? decodeURIComponent(pathParts[eIndex + 1])
      : '';

    async function load() {
      if (!filecode) return;
      document.getElementById('videoPlayer').src = `https://vidara.so/e/${filecode}`;
      try {
        const res = await fetch(`/_api/v1/video/info?filecode=${encodeURIComponent(filecode)}`);
        const data = await res.json();
        if (data.status === 200) {
          document.getElementById('videoTitle').textContent = data.result[0].video_title;
          document.title = data.result[0].video_title + " - Donat Hyper";
        }
      } catch (e) {}
    }
    function showToast() { const t = document.getElementById('toast'); t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
    load();
  </script>



</body>
</html>
